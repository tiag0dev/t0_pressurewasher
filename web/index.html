<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gauge" class="t0-panel hidden">
    <span class="lbl">tank</span>
    <div class="blocks"></div>
    <span class="pct">100%</span>
</div>
<div id="refill" class="t0-panel hidden">
    <div class="t0-tag"><b>t0</b> / pressurewasher</div>
    <svg viewBox="0 0 320 180" aria-hidden="true">
        <defs>
            <clipPath id="rf-tank"><rect x="56" y="117" width="88" height="31" rx="5"/></clipPath>
            <clipPath id="rf-bottle"><rect x="-15" y="-73" width="30" height="55" rx="7"/></clipPath>
        </defs>
        <!-- Nettoyeur : corps, réservoir vitré, poignée, lance, buse -->
        <rect class="rf-body" x="40" y="108" width="152" height="48" rx="11"/>
        <rect class="rf-handle" x="150" y="148" width="20" height="28" rx="5" transform="rotate(12 160 150)"/>
        <rect class="rf-body" x="190" y="125" width="108" height="8" rx="4"/>
        <rect class="rf-nozzle" x="294" y="121" width="14" height="16" rx="3"/>
        <rect class="rf-inlet" x="88" y="100" width="20" height="10" rx="2"/>
        <rect class="rf-glass" x="56" y="117" width="88" height="31" rx="5"/>
        <g clip-path="url(#rf-tank)">
            <rect id="rf-tank-water" class="rf-water" x="56" y="117" width="88" height="31"/>
        </g>
        <rect class="rf-shine" x="60" y="120" width="5" height="25" rx="2.5"/>
        <!-- Filet d'eau bouteille -> bouchon -->
        <line id="rf-stream" x1="98" y1="88" x2="98" y2="106"/>
        <!-- Bouteille renversée au-dessus du bouchon (goulot en 0,0) -->
        <g transform="translate(98 86) rotate(-38)">
            <rect class="rf-glass" x="-15" y="-73" width="30" height="55" rx="7"/>
            <g clip-path="url(#rf-bottle)">
                <rect id="rf-bottle-water" class="rf-water" x="-15" y="-73" width="30" height="55"/>
            </g>
            <path class="rf-glass" d="M-15 -24 Q-15 -14 -5 -12 L-5 0 L5 0 L5 -12 Q15 -14 15 -24 Z"/>
            <rect class="rf-label" x="-15" y="-56" width="30" height="16"/>
            <rect class="rf-shine" x="-11" y="-68" width="4" height="44" rx="2"/>
        </g>
    </svg>
    <div class="rf-text"><span class="rf-title"></span><span class="rf-pct">0%</span></div>
    <div class="rf-hint"><kbd>X</kbd> <span class="rf-cancel"></span></div>
</div>
<script src="app.js"></script>
</body>
</html>
